services:
  llm-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
